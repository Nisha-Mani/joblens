spring:
  application:
    name: joblens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joblens}
    username: ${POSTGRES_USER:joblens}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:5}MB
      max-request-size: ${MAX_UPLOAD_MB:5}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: joblens
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.joblens: INFO

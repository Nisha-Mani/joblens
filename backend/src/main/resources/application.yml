server:
  # Behind CloudFront/nginx: honour X-Forwarded-* so redirects and scheme detection are correct.
  forward-headers-strategy: framework

spring:
  application:
    name: joblens
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/joblens}
    username: ${POSTGRES_USER:joblens}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_MB:5}MB
      max-request-size: ${MAX_UPLOAD_MB:5}MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1500}
    rate-limit-per-hour: ${ANALYSIS_RATE_LIMIT_PER_HOUR:20}
  storage:
    type: ${STORAGE_TYPE:local}   # local | s3
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    s3:
      bucket: ${S3_BUCKET:}
      region: ${AWS_REGION:}
      endpoint: ${S3_ENDPOINT:}   # only for S3-compatible services such as MinIO
  jwt:
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: joblens
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.joblens: INFO

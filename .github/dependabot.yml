version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*", "org.springdoc*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      react: { patterns: ["react*", "@types/react*"] }
      tooling: { patterns: ["vite*", "vitest*", "@vitejs/*", "tailwindcss", "@tailwindcss/*", "typescript", "oxlint"] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: joblens_test
          POSTGRES_USER: joblens
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U joblens -d joblens_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_USER: joblens
      POSTGRES_PASSWORD: ci-test-password
      TEST_DB_URL: jdbc:postgresql://localhost:5432/joblens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

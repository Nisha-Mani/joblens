server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resume uploads are capped at 5 MB by the API; leave headroom for multipart overhead.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # The API (and its docs) live behind the same origin, so the SPA needs no CORS or API URL.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # AI calls can take a while
    }
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change: cache them hard.
    # NOTE: `expires` (unlike add_header) keeps the server-level security headers above. Any add_header
    # inside a location block would silently drop all of them for that location.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return the app shell, which must always be revalidated.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
